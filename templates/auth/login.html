{% extends "base.html" %}
{% block content %}
<div class="flex justify-center items-center py-12">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-primary">Connexion</h2>
            <p class="text-sm text-gray-500 mt-1">Accédez à votre espace sécurisé BOYA JC</p>
        </div>

        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Adresse Email</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary focus:outline-none transition"
                    placeholder="exemple@boyajc.com">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Mot de passe</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary focus:outline-none transition"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-primary hover:bg-blue-900 text-white font-bold py-2.5 rounded-lg transition shadow-md">
                Se connecter
            </button>
        </form>

        <div class="mt-6 text-center border-t border-gray-100 pt-4">
            <p class="text-sm text-gray-600">Vous n'avez pas de compte ?
    <a href="{{ url_for('register') }}" class="text-secondary font-semibold hover:underline">Faire une demande d'inscription</a>
</p>
        </div>
    </div>
</div>
{% endblock %}
